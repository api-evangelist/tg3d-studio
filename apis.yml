aid: tg3d-studio
name: TG3D Studio
description: >-
  TG3D Studio Inc. is a 3D fashion technology company (founded 2016, headquartered
  in Taiwan) whose Scanatic platform digitizes the body, materials, and clothing
  for made-to-measure and custom fashion. Its products include the Scanatic 360
  Body Scanner (roughly 250 body measurements captured in seconds), Scanatic
  Studio 3D product-visualization and digital-sampling software, the Cloudzet
  mobile body-scan app, and the BESPOKE-N virtual try-on app. For developers and
  partners, TG3D exposes two RESTful API libraries: ScanAPI — offered free to
  partners for integrating Cloudzet scan-user registration and building custom UI
  that controls the Scanatic 360 Body Scanner — and APIConnect, which manipulates
  data across the Scanatic Body, Nuno3D, and StyleBook services. API access is
  key-based and issued from the Scanatic for Fashion Developer Console; all HTTPS
  traffic is 256-bit encrypted and each Scanatic Body Service includes up to 1,500
  free API requests per month.
